<style>
/* Layout concept: one narrow column like a market pamphlet. A painted scene on top that brightens from dusk to day as the player rises, then hard-edged sign-painter buttons for every decision. */
:root{
  --bg:#E8ECE6; --surface:#F6F8F3; --ink:#17211D; --mute:#51605A; --line:#C3CCC4;
  --good:#1B7A4B; --good-bg:#DDEFE4; --mid:#7D6000; --mid-bg:#F6ECC8; --bad:#B03A22; --bad-bg:#F7DDD5;
  --w:#F2B705; --on-w:#1A1405;
  --display:"Alfa Slab One", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surface:#171F1B; --ink:#E8EEE7; --mute:#97A79E; --line:#2A3630;
    --good:#6FD4A0; --good-bg:#14301F; --mid:#E8C45A; --mid-bg:#2E2810; --bad:#FF9078; --bad-bg:#37201A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171F1B; --ink:#E8EEE7; --mute:#97A79E; --line:#2A3630;
  --good:#6FD4A0; --good-bg:#14301F; --mid:#E8C45A; --mid-bg:#2E2810; --bad:#FF9078; --bad-bg:#37201A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  padding-block:14px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.app.w-ajegunle{--w:#F2B705; --on-w:#1A1405}
.app.w-onitsha{--w:#D9502B; --on-w:#1A0C07}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.tiny{font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono); color:var(--mute)}
.screen{display:flex; flex-direction:column; gap:16px; animation:rise .35s ease both}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none} *{transition:none!important}}

/* masthead */
.mast{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.mast .tiny{margin:0}
.title{font-family:var(--display); font-size:clamp(2.7rem, 13vw, 4.4rem); line-height:.95; letter-spacing:-.01em; text-wrap:balance}
.lede{font-size:1.08rem; max-width:46ch}
.btn{
  font:700 1rem/1.2 var(--body); background:var(--w); color:var(--on-w); border:2px solid var(--ink); border-radius:10px;
  padding:14px 18px; min-height:48px; cursor:pointer; box-shadow:4px 4px 0 var(--ink); text-align:center; width:100%;
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:hover{transform:translate(1px,1px); box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--surface); color:var(--ink)}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.btn-row{display:flex; gap:12px; flex-wrap:wrap}
.btn-row .btn{flex:1 1 200px}

/* character cards */
.cards{display:grid; gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-width:0}
.card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px}
.card h2{font-family:var(--display); font-size:1.7rem; line-height:1.05}
.scene{display:block; width:100%; height:auto; aspect-ratio:400/150}

/* hud */
.hud{display:grid; grid-template-columns:1.3fr 1.4fr .8fr; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.stat{display:flex; flex-direction:column; gap:3px; min-width:0}
.stat .val{font-family:var(--mono); font-weight:500; font-size:1.02rem; overflow-wrap:anywhere}
.bar{height:12px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:4px}
.bar i{display:block; height:100%; background:var(--w); border-radius:99px; transition:width .5s ease}
.bar i.low{background:var(--bad)}
.steps{display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
.steps i{height:7px; border-radius:99px; background:var(--line)}
.steps i.done{background:var(--ink)}
.steps i.cur{background:var(--w); outline:2px solid var(--ink); outline-offset:1px}

/* narrative */
.place{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.stage-name{font-family:var(--display); font-size:2.1rem; line-height:1.05; text-wrap:balance}
.story{font-size:1.1rem; max-width:60ch}
.night{font-style:italic; color:var(--mute); max-width:60ch}

/* task */
.task{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:14px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font:500 .74rem/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; padding:6px 9px; border-radius:99px; border:1px solid var(--line); color:var(--mute); background:var(--bg)}
.chip.skill{background:var(--w); color:var(--on-w); border-color:var(--ink)}
.q{font-size:1.14rem; font-weight:700; max-width:58ch; text-wrap:pretty}
.opts{display:flex; flex-direction:column; gap:12px}
.opt{
  display:grid; grid-template-columns:30px 1fr; gap:12px; align-items:start; text-align:left; cursor:pointer;
  font:400 1rem/1.4 var(--body); color:var(--ink); background:var(--bg); border:2px solid var(--ink); border-radius:10px;
  padding:12px 14px; box-shadow:3px 3px 0 var(--ink); min-height:52px;
  transition:transform .08s ease, box-shadow .08s ease;
}
.opt:hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink)}
.opt:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--ink)}
.opt .l{font:500 .95rem/1 var(--mono); background:var(--w); color:var(--on-w); border:1.5px solid var(--ink); border-radius:6px; width:30px; height:30px; display:grid; place-items:center}
.opt span:last-child{min-width:0; overflow-wrap:anywhere}

/* result */
.result{border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; border:2px solid var(--ink)}
.result.r3{background:var(--good-bg)} .result.r2{background:var(--good-bg)}
.result.r1{background:var(--mid-bg)} .result.r0{background:var(--bad-bg)}
.verdict{font-family:var(--display); font-size:1.5rem; line-height:1.1}
.r3 .verdict,.r2 .verdict{color:var(--good)} .r1 .verdict{color:var(--mid)} .r0 .verdict{color:var(--bad)}
.deltas{display:flex; flex-wrap:wrap; gap:8px}
.delta{font:500 .9rem/1 var(--mono); padding:7px 10px; border-radius:8px; background:var(--surface); border:1px solid var(--ink)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.better{background:var(--surface); border:1px dashed var(--ink); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:4px}
.wall{background:var(--surface); border:2px solid var(--bad); border-radius:10px; padding:12px 14px; color:var(--ink)}

/* summary */
.rank{display:flex; flex-direction:column; gap:6px; background:var(--w); color:var(--on-w); border:2px solid var(--ink); border-radius:14px; padding:16px; box-shadow:4px 4px 0 var(--ink)}
.rank .tiny{color:var(--on-w); opacity:.8}
.rank .big{font-family:var(--display); font-size:2rem; line-height:1.05}
.lesson{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:6px}
.lesson p.t{font-weight:700; font-size:1.08rem}

/* end */
.index{display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.index .num{font-family:var(--display); font-size:clamp(4.4rem, 22vw, 7rem); line-height:.9}
.tier{font-family:var(--display); font-size:1.6rem; line-height:1.1}
.skills{display:flex; flex-direction:column; gap:10px}
.skill-row{display:grid; grid-template-columns:minmax(0,9.5rem) 1fr 3rem; gap:10px; align-items:center}
.skill-row .name{font-size:.95rem; overflow-wrap:anywhere}
.skill-row .pc{font:500 .85rem/1 var(--mono); text-align:right}
.recap{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px}
.recap li{display:grid; grid-template-columns:auto 1fr; gap:10px}
.recap b{font-family:var(--mono); font-weight:500; font-size:.8rem; background:var(--w); color:var(--on-w); border:1.5px solid var(--ink); border-radius:6px; padding:3px 7px; height:fit-content; white-space:nowrap}
.share{font:500 .9rem/1.5 var(--mono); background:var(--bg); border:1px dashed var(--ink); border-radius:10px; padding:12px; overflow-wrap:anywhere; user-select:all}
.note{min-height:1.4em; font-size:.9rem; color:var(--mute)}
.fine{font-size:.85rem; color:var(--mute); max-width:60ch}
.how{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.how li{display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:baseline}
.how .tiny{color:var(--ink)}
@media (max-width:380px){.hud{grid-template-columns:1fr 1fr} .hud .stat:nth-child(2){grid-column:1/-1;order:3} .how li{grid-template-columns:1fr; gap:2px}}
</style>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
var fmt = function(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); };
var naira = function(n){ return "₦" + fmt(n); };
var signed = function(n){ return (n>0?"+":"−") + "₦" + fmt(Math.abs(n)); };
var o = function(t,p,c,h,w){ return {t:t,p:p,c:c,h:h,w:w}; };
var clamp = function(n,a,b){ return Math.max(a, Math.min(b, n)); };
var LETTERS = ["A","B","C","D"];
var SKILLS = ["Money math","Risk & scams","Planning","People & trust","Logic"];
var KEY = "street-rise-v1";

/* ---------- content ---------- */
var BLESSING = {
  id:"blessing", name:"Blessing", cls:"w-ajegunle", place:"Ajegunle, Lagos",
  blurb:"Thirteen years old. A bowl of pure water on her head and a mother who coughs through the night.",
  stages:[
    { rank:"Street Hustler", place:"Boundary Junction, 5:40 a.m.", age:13,
      intro:"The generator next door coughs awake before you do. Mama’s cough is worse this morning and the rent man comes on Friday. You tie your wrapper, lift the bowl of pure water onto your head, and promise yourself one thing: go home with more than you left with.",
      tasks:[
        { skill:"Money math", type:"Number puzzle",
          q:"You buy one bag of 20 sachets of pure water for ₦400 and sell each for ₦50. By evening, 4 sachets have burst or gone warm and you could not sell them. What is your real profit today?",
          opts:[
            o("₦600",0,0,-8,"That is what you would earn if all 20 sold. Four were lost, so the real profit is lower. You promised Mama more than you brought home."),
            o("₦400",3,400,8,"16 sold × ₦50 = ₦800, minus the ₦400 you paid for the bag = ₦400. Knowing your true profit, after cost and losses, is the first skill of every rich person."),
            o("₦800",0,0,-6,"That is the money you collected, but ₦400 of it was already spent on the bag. Profit is what remains after cost.")
          ]},
        { skill:"Risk & scams", type:"Life choice",
          q:"A boy in a clean shirt at the junction says, “Give me your savings today. By Sunday I will return three times the money. Plenty people don collect.” You have almost ₦900 saved. It is everything you own.",
          opts:[
            o("Give him all your savings.",0,-900,-15,"Sunday came and he never did. Money that triples in three days with no work behind it is paid for by somebody, and this time it was you."),
            o("Walk away. Money that multiplies with no work is a trap.",3,0,5,"Right. When a deal sounds too sweet, ask who is really paying for it. Your savings are still in your pocket."),
            o("Give him ₦200 first, to test him.",1,-200,-3,"You lost ₦200 you needed. Testing a scam with your own money is still losing money.")
          ]}
      ],
      night:"That night you count coins by the light of Mama’s wick lamp. She pretends to sleep, but you hear her whisper a prayer with your name in it.",
      lesson:"Profit is what is left after cost and loss. And if money promises to multiply without work, somebody is paying for it, and it will be you." },
    { rank:"Apprentice", place:"Tolu Road, Ajegunle", age:15,
      intro:"Two years on, Mama’s cough is better but school fees are not. Your cousin in Apapa says he can get you quick work by Monday. Down the road, Mrs. Taiwo’s tailoring shop hums with six machines, and she has been watching how neatly you count change.",
      tasks:[
        { skill:"Planning", type:"Life choice",
          q:"School fees are due and you cannot do everything at once. Which road do you take?",
          opts:[
            o("Ask Mrs. Taiwo to take you as an apprentice, and keep selling pure water in the evenings.",3,300,6,"Slow money, but a skill that feeds you for life. Mrs. Taiwo nods: “Come tomorrow, and come early.”"),
            o("Follow your cousin to Apapa for the quick work.",0,1500,-12,"Two weeks of pay, then the work disappeared with the man who promised it. No skill, no job, and you missed school."),
            o("Leave school and hawk full time for more money now.",1,800,-4,"The cash is real, but you will still be hawking at thirty. Income without a skill stays small.")
          ]},
        { skill:"Money math", type:"Number puzzle",
          q:"You will save ₦500 every week in your church ajo to buy your own sewing machine at ₦12,000. Mrs. Taiwo adds a ₦2,000 Christmas bonus toward it. How many weeks of saving do you need?",
          opts:[
            o("20 weeks",3,12000,10,"(₦12,000 − ₦2,000) ÷ ₦500 = 20. You counted it, planned it, and bought it. A skill you own cannot be taken from you."),
            o("24 weeks",1,0,-2,"You forgot the bonus, so you planned four weeks longer than you needed to. Close, but a plan should use every number."),
            o("10 weeks",0,0,-6,"₦500 × 10 is only ₦5,000. You gave up at week 10 thinking the machine was bought. It was not.")

      ],
      night:"The first night you sit at your own machine, the needle sings. You think of Mama’s hands, folded in her lap since her cough began, and you promise those hands will rest.",
      lesson:"A skill pays forever and quick money does not. Write your goal as a number and count the weeks to reach it." },
    { rank:"Trader", place:"Boundary Market", age:19,
      intro:"Your own table at Boundary Market. A roll of Ankara, a machine that is truly yours, and customers who now call you Aunty Bless. You are nineteen and the rent man no longer knocks. But every naira you spend is a naira you will not see again.",
      tasks:[
        { skill:"Money math", type:"Number puzzle",
          q:"Cloth and thread for 3 blouses cost you ₦3,000 in total. You want a 50% profit on that cost. What should each blouse sell for?",
          opts:[
            o("₦1,500",3,45000,8,"₦3,000 + 50% = ₦4,500, and ₦4,500 ÷ 3 = ₦1,500 each. Fair for you, fair for the customer, and your table grows."),
            o("₦1,000",0,0,-6,"That is exactly your cost, so there is zero profit. You were busy all week and richer by nothing."),
            o("₦1,800",1,15000,-2,"That is an 80% profit, but the lady at the next table sells at ₦1,600. Half your blouses stayed on the rope.")
          ]},
        { skill:"People & trust", type:"Life choice",
          q:"A new customer wants a ₦6,000 outfit and says, “I will pay next week.” Your fabric money is nearly finished. Mama Chike from the next table whispers, “Ah ah, just trust her.”",
          opts:[
            o("Collect half as deposit, write the order and balance in your notebook, and deliver when she pays the rest.",3,30000,8,"A deposit protects both of you. Her promise is now written in ink, and she tells her friends about the careful tailor."),
            o("Refuse. No money, no cutting.",1,5000,-2,"Safe, but she walks to another table. You lost a customer who might have brought ten more."),
            o("Cut and sew the whole outfit on trust.",0,-6000,-10,"She never came back. ₦6,000 of fabric and three days of your life, gone.")
          ]}
      ],
      night:"You close the table and the market goes quiet. For the first time there is more in the tin box than you came with. You count it twice, just to be sure it is real.",
      lesson:"Price is cost plus profit, never less. Write every debt in a notebook. A deposit turns a promise into a plan." },
    { rank:"Business Owner", place:"Ajegunle Main Road", age:23,
      intro:"Bless Couture is a small shop with two machines and your name hand-painted above the door. Mama sits proudly by the entrance in a new wrapper. Growth is calling, and so are people who want a piece of what you have built.",
      tasks:[
        { skill:"Money math", type:"Number puzzle",
          q:"You need ₦300,000 for two more machines. A loan app wants ₦390,000 back in 30 days. A cooperative society wants ₦345,000 back over 6 months in small weekly parts. Which one costs you less extra money?",
          opts:[
            o("The cooperative society",3,250000,8,"₦45,000 extra against ₦90,000 extra. The cooperative costs half as much and the weekly parts are easy to carry. The new machines paid for themselves."),
            o("The loan app",0,-90000,-12,"₦90,000 extra in just 30 days. You had to sell one machine to pay, and the dream shrank."),
            o("Borrow nothing and stay small",1,40000,-2,"Safe, but slow. Good loans, cheap and used for tools that earn, are how small shops grow.")
          ]},
        { skill:"Risk & scams", type:"Life choice",
          q:"A man orders ₦150,000 of clothes for an event. He shows an SMS saying “Transfer successful” and begs you to release the goods quickly because his car is waiting. Your own banking app has not changed. What do you do?",
          opts:[
            o("Wait until the money shows in my own bank app, then release the goods.",3,0,8,"The SMS was fake. Only your own bank app tells the truth. He left, and your ₦150,000 of clothes stayed with you."),
            o("Release the goods. The SMS looks real.",0,-150000,-15,"The SMS was fake and the money never came. Urgency is how thieves hurry you past your own good sense."),
            o("Release half now and the rest later.",1,-75000,-8,"You lost half. A fake alert is not half true.")
          ]}
      ],
      night:"At closing time Mama runs her palm along the new machines. “Who would have thought,” she says softly, “that pure water on a child’s head would lead here?”",
      lesson:"The cheapest loan is the one with the lowest total repayment. Trust your own records, never someone else’s screen." },
    { rank:"Employer", place:"Bless Couture, Ajegunle", age:28,
      intro:"Twelve people now work under your roof, and twelve families eat because you decided at fifteen to learn a skill. A 40-piece wedding order arrives, the biggest of your life, due in five working days. Pressure shows what a leader is made of.",
      tasks:[
        { skill:"People & trust", type:"Life choice",
          q:"Ada, your fastest seamstress, has been late three times. She is a single mother and her child has been sick. The big order is due this week. What do you do?",
          opts:[
            o("Talk with her privately, offer flexible hours with a clear daily target, and pay per piece.",3,4000000,10,"Ada cried with relief and sewed faster than ever. The order was safe, the team saw how you treat people, and loyalty became your best asset."),
            o("Dismiss her to show the others you are serious.",1,1000000,-12,"You kept the schedule but lost your best hands, and everyone saw how you treat a mother in trouble."),
            o("Say nothing and hope it fixes itself.",0,-300000,-6,"The problem grew quietly and the deadline slipped. The bride was angry.")
          ]},
        { skill:"Logic", type:"Logic puzzle",
          q:"The order is 40 outfits in 5 working days. Three seamstresses sew 2 outfits a day each for all 5 days. Ada also sews 2 a day, but only on 3 of the 5 days. How many can you finish, and what closes the gap?",
          opts:[
            o("36 outfits. Hire one extra seamstress for 2 days (2 × 2 = 4 more).",3,6000000,10,"3 × 2 × 5 = 30, plus Ada’s 2 × 3 = 6, makes 36. You were 4 short, and one extra pair of hands for two days covered it exactly. You promised only what the numbers allow."),
            o("36 outfits. Ask the bride to accept 36.",1,1500000,-4,"The math was right, but you did not solve it. The bride accepted, but she remembered."),
            o("40 outfits. It will be fine.",0,-500000,-8,"You never did the sum. On Friday you were four outfits short and the bride was in your shop."),

      night:"On Saturday the bride cries happy tears at the sight of forty matching outfits. Ada hugs her baby after the show, and her pay that week is the biggest she has ever earned. You realise you are no longer just earning. You are carrying people.",

    { rank:"Wealth Builder", place:"Bless Couture Factory, Ikeja", age:34,

      tasks:[
        { skill:"Planning", type:"Life choice",
          q:"You have ₦10 million ready to invest. A friend begs you to put all of it into a new coin that will 10x by Christmas. What is your plan?",
          opts:[
            o("Split it: expand the factory, buy land after verifying the documents, keep six months of expenses safe, and put only a small amount into new ideas.",3,12000000,10,"Slow, spread and protected. Your money grew in three places at once and one bad month could never end you."),
            o("Put everything in the coin. My friend is smart.",0,-10000000,-20,"The coin collapsed in a week. All ten million, gone. Never put everything in one basket, and never in something you cannot check."),
            o("Buy a big car and throw a party so everyone sees my success.",1,-2000000,5,"The party was loud and the money was spent. Looking rich and being rich are not the same.")

/* ---------- scene art ---------- */
var SKY = [["#2B3A55","#C77B4A"],["#34506E","#E39A5C"],["#4A6F8F","#F0B567"],["#6C95B5","#F7CF82"],["#8DB7D2","#FBE0A0"],["#A9D3E6","#FFEFB8"]];

function figure(x, kind, stage, body){
  var k = stage >= 2 ? 1.15 : 1, b = 138;
  var s = "";
  s += '<rect x="'+(x-4.5*k)+'" y="'+(b-20*k)+'" width="'+(9*k)+'" height="'+(14*k)+'" rx="3" fill="'+body+'"/>';
  s += '<rect x="'+(x-4*k)+'" y="'+(b-8*k)+'" width="'+(3*k)+'" height="'+(8*k)+'" fill="#2A1A12"/>';
  s += '<rect x="'+(x+1*k)+'" y="'+(b-8*k)+'" width="'+(3*k)+'" height="'+(8*k)+'" fill="#2A1A12"/>';
  s += '<circle cx="'+x+'" cy="'+(b-25*k)+'" r="'+(5*k)+'" fill="#8A5636"/>';
  if(kind === "bowl" && stage < 2){
    s += '<ellipse cx="'+x+'" cy="'+(b-31*k)+'" rx="8" ry="3" fill="#C9CED1"/>';
    s += '<rect x="'+(x-5)+'" y="'+(b-35*k)+'" width="3" height="4" fill="#E8F3F7"/><rect x="'+(x)+'" y="'+(b-36*k)+'" width="3" height="5" fill="#E8F3F7"/><rect x="'+(x+4)+'" y="'+(b-35*k)+'" width="3" height="4" fill="#E8F3F7"/>';
  }
  if(kind === "tray" && stage < 2){
    s += '<rect x="'+(x-11)+'" y="'+(b-15*k)+'" width="22" height="3" fill="#6B4423"/>';
    s += '<rect x="'+(x-9)+'" y="'+(b-23*k)+'" width="3" height="8" fill="#D9502B"/><rect x="'+(x-3)+'" y="'+(b-23*k)+'" width="3" height="8" fill="#F2B705"/><rect x="'+(x+3)+'" y="'+(b-23*k)+'" width="3" height="8" fill="#1F8A8A"/>';
  }
  return s;
}

function windows(x, y, w, h, on){
  var s = "";
  for(var r=0; r<Math.floor(h/12); r++){
    for(var c=0; c<Math.floor(w/12); c++){
      s += '<rect x="'+(x+4+c*12)+'" y="'+(y+6+r*12)+'" width="5" height="6" fill="'+(on((r+c)%3)?"#FFE9A8":"#46524D")+'"/>';
    }
  }
  return s;
}

function scene(worldId, stage, uid){
  var c = SKY[stage], sunY = 118 - stage*14, s = "";
  var label = worldId === "blessing" ? "Illustration of Ajegunle, Lagos" : "Illustration of Onitsha and the Niger Bridge";
  s += '<svg class="scene" viewBox="0 0 400 150" role="img" aria-label="'+label+'">';
  s += '<defs><linearGradient id="sky'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient>';
  s += '<linearGradient id="riv'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B7A86"/><stop offset="1" stop-color="#16444D"/></linearGradient></defs>';
  s += '<rect width="400" height="150" fill="url(#sky'+uid+')"/>';
  s += '<circle cx="300" cy="'+sunY+'" r="22" fill="#FFE08A" opacity=".92"/>';
  var i;
  if(worldId === "blessing"){
    var hs = [34,48,30,54,40,46,32,50,38,44], x = -10;
    for(i=0; i<10; i++){
      var h = hs[i];
      s += '<polygon points="'+x+',138 '+x+','+(138-h)+' '+(x+22)+','+(138-h-9)+' '+(x+44)+','+(138-h)+' '+(x+44)+',138" fill="#2B221F"/>';
      if(stage < 3 && i%2 === 0){ s += '<rect x="'+(x+10)+'" y="'+(138-h+12)+'" width="6" height="6" fill="#FFD36B" opacity=".85"/>'; }
      x += 44;
    }
    if(stage >= 3){ s += '<rect x="330" y="46" width="46" height="92" fill="#33403B"/>' + windows(330,46,46,92,function(m){return m!==1;}); }
    if(stage >= 5){ s += '<rect x="14" y="62" width="40" height="76" fill="#3B4944"/>' + windows(14,62,40,76,function(m){return m!==2;}); }
    s += '<line x1="48" y1="60" x2="48" y2="138" stroke="#1A1412" stroke-width="3"/><line x1="38" y1="66" x2="58" y2="66" stroke="#1A1412" stroke-width="3"/>';
    s += '<path d="M-10 72 Q100 88 210 70 T410 74" stroke="#1A1412" stroke-width="1.2" fill="none"/>';
    s += '<rect y="138" width="400" height="12" fill="#231C19"/>';
    s += '<g transform="translate(150,110)"><rect width="100" height="28" rx="5" fill="#F2B705"/><rect y="13" width="100" height="5" fill="#17211D"/>';
    for(i=0; i<5; i++){ s += '<rect x="'+(8+i*18)+'" y="4" width="13" height="8" fill="#17211D"/>'; }
    s += '<circle cx="22" cy="28" r="7" fill="#111"/><circle cx="22" cy="28" r="3" fill="#999"/><circle cx="78" cy="28" r="7" fill="#111"/><circle cx="78" cy="28" r="3" fill="#999"/></g>';
    s += figure(96, "bowl", stage, "#1F8A8A");
  } else {
    if(stage >= 3){ s += '<rect x="340" y="46" width="44" height="92" fill="#4A3A33"/>' + windows(340,46,44,92,function(m){return m!==1;}); }
    s += '<rect y="112" width="400" height="26" fill="url(#riv'+uid+')"/>';
    for(i=0; i<7; i++){ s += '<line x1="'+(20+i*55)+'" y1="'+(118+(i%3)*6)+'" x2="'+(44+i*55)+'" y2="'+(118+(i%3)*6)+'" stroke="#9FD6DC" stroke-width="1.5" opacity=".5"/>'; }
    s += '<rect y="92" width="400" height="5" fill="#1D1D1F"/>';
    s += '<rect x="96" y="97" width="7" height="22" fill="#2B2B2E"/><rect x="296" y="97" width="7" height="22" fill="#2B2B2E"/>';
    var spans = [[0,200],[200,400]], H = 42;
    for(var sp=0; sp<2; sp++){
      var x0 = spans[sp][0], x1 = spans[sp][1], cx = (x0+x1)/2;
      s += '<path d="M'+x0+' 92 Q'+cx+' '+(92-2*H)+' '+x1+' 92" stroke="#1D1D1F" stroke-width="3" fill="none"/>';
      for(var t=0.1; t<0.95; t+=0.1){
        var px = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*x1, py = 92 - 4*H*t*(1-t);
        s += '<line x1="'+px.toFixed(1)+'" y1="'+py.toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="92" stroke="#1D1D1F" stroke-width="1.2"/>';
      }
    }
    s += '<rect y="136" width="400" height="14" fill="#2A1F1A"/>';
    var um = [[44,"#D9502B"],[128,"#F2B705"],[222,"#1F8A8A"],[304,"#F4EFE6"],[372,"#D9502B"]];
    for(i=0; i<um.length; i++){
      s += '<line x1="'+um[i][0]+'" y1="124" x2="'+um[i][0]+'" y2="140" stroke="#3A2A22" stroke-width="2"/>';
      s += '<path d="M'+(um[i][0]-20)+' 126 A20 14 0 0 1 '+(um[i][0]+20)+' 126 Z" fill="'+um[i][1]+'"/>';
    }
    s += figure(86, "tray", stage, "#E9E4D8");
  }
  s += '</svg>';
  return s;
}

function newState(who){
  return { who:who, stage:0, task:0, phase:"intro", cash:500, heart:60, pts:0, answers:[], order:[], pick:null, wall:false };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw){ return null; }
    var s = JSON.parse(raw);
    if(s && WORLDS[s.who] && typeof s.stage === "number" && s.phase && s.phase !== "home"){ return s; }
  }catch(e){}
  return null;
}
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function world(){ return WORLDS[S.who]; }
function shuffle(n){
  var a = [], i, j, t;
  for(i=0; i<n; i++){ a.push(i); }
  for(i=n-1; i>0; i--){ j = Math.floor(Math.random()*(i+1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function go(phase){ S.phase = phase; save(); render(); window.scrollTo(0,0); }

  return '<div class="screen">' + hud() + steps() +
    scene(w.id, S.stage, "g") +
    '<div class="place"><span class="tiny">Stage '+(S.stage+1)+' of 6 · '+esc(st.rank)+'</span><span class="tiny">Age '+st.age+'</span></div>' +
    '<h2 class="stage-name">'+esc(st.place)+'</h2>' +
    '<p class="story">'+esc(st.intro)+'</p>' +
    '<button class="btn" data-act="begin">Begin</button></div>';
}

function vTask(){
  var w = world(), st = w.stages[S.stage], t = st.tasks[S.task];
  var s = '<div class="screen">' + hud() + steps();
  s += '<div class="task"><div class="chips"><span class="chip skill">'+esc(t.skill)+'</span><span class="chip">'+esc(t.type)+'</span><span class="chip">Task '+(S.task+1)+' of '+st.tasks.length+'</span></div>';
  s += '<p class="q">'+esc(t.q)+'</p><div class="opts">';
  S.order.forEach(function(oi, pos){
    s += '<button class="opt" data-act="pick" data-i="'+oi+'"><span class="l">'+LETTERS[pos]+'</span><span>'+esc(t.opts[oi].t)+'</span></button>';
  });
  return s + '</div></div></div>';
}

function vResult(){
  var w = world(), st = w.stages[S.stage], t = st.tasks[S.task], opt = t.opts[S.pick.i];
  var best = 0, i;
  for(i=0; i<t.opts.length; i++){ if(t.opts[i].p > t.opts[best].p){ best = i; } }
  var verdict = ["Costly move","Weak move","Good move","Best move"][opt.p];
  var s = '<div class="screen">' + hud() + steps();
  s += '<div class="result r'+opt.p+'" role="status"><span class="verdict">'+verdict+'</span><p>'+esc(opt.w)+'</p><div class="deltas">';
  s += '<span class="delta '+(S.pick.dc>0?"up":(S.pick.dc<0?"down":""))+'">'+(S.pick.dc===0?"Net worth unchanged":signed(S.pick.dc))+'</span>';
  s += '<span class="delta '+(opt.h>0?"up":(opt.h<0?"down":""))+'">'+(opt.h>0?"+":(opt.h<0?"−":""))+Math.abs(opt.h)+' Heart</span>';
  s += '<span class="delta '+(opt.p>0?"up":"")+'">+'+opt.p+' Wisdom</span></div></div>';
  if(best !== S.pick.i){
    s += '<div class="better"><span class="tiny">A better move</span><p><b>'+esc(t.opts[best].t)+'</b></p><p>'+esc(t.opts[best].w)+'</p></div>';
  }
  if(S.wall){
    s += '<div class="wall"><b>You hit a wall.</b> Your heart is empty. You sit down, cry, and someone who loves you finds you. You rest, you eat, you rise again with a Heart of 30.</div>';
  }
  var last = S.task >= st.tasks.length - 1;
  s += '<button class="btn" data-act="next">'+(last?"Finish this stage":"Next task")+'</button></div>';
  return s;
}

function vNight(){
  var w = world(), st = w.stages[S.stage];
  var last = S.stage >= 5;
  return '<div class="screen">' + hud() + steps() +
    '<div class="rank"><span class="tiny">Stage '+(S.stage+1)+' complete</span><span class="big">'+esc(st.rank)+'</span><span class="mono">Net worth '+naira(S.cash)+'</span></div>' +
    '<p class="night">'+esc(st.night)+'</p>' +
    '<div class="lesson"><span class="tiny">What '+esc(w.name)+' learned</span><p class="t">'+esc(st.lesson)+'</p></div>' +
    '<button class="btn" data-act="advance">'+(last?"See my Street Index":"Go to age "+w.stages[S.stage+1].age)+'</button></div>';
}

function vEnd(){
  var w = world(), total = 0, maxp = S.answers.length * 3, i;
  for(i=0; i<S.answers.length; i++){ total += S.answers[i].p; }
  var pct = maxp ? total / maxp : 0;
  var index = Math.round(70 + 60*pct);
  var tier = TIERS[TIERS.length-1];
  for(i=0; i<TIERS.length; i++){ if(pct >= TIERS[i].min){ tier = TIERS[i]; break; } }
  var other = S.who === "blessing" ? "ikenna" : "blessing";
  var shareText = "I played Street Rise as " + w.name + " and scored a Street Index of " + index + " (" + tier.name + "). Final net worth " + naira(S.cash) + ". Can you beat it?";
  var s = '<div class="screen">';
  s += scene(w.id, 5, "e");
  s += '<div class="index"><span class="tiny">Street Index · '+esc(w.name)+'</span><span class="num mono" style="font-family:var(--display)">'+index+'</span><span class="tier">'+esc(tier.name)+'</span></div>';
  s += '<p class="lede">'+esc(tier.msg)+'</p>';
  s += '<div class="rank"><span class="tiny">Final net worth</span><span class="big">'+naira(S.cash)+'</span><span class="mono">'+total+' of '+maxp+' wisdom points</span></div>';
  s += '<p class="story">'+esc(w.finale)+'</p>';
  s += '<div class="lesson"><span class="tiny">Your thinking by skill</span><div class="skills">';
  SKILLS.forEach(function(k){
    var sum = 0, n = 0;
    S.answers.forEach(function(a){ if(a.k === k){ sum += a.p; n++; } });
    var p = n ? Math.round(100*sum/(3*n)) : 0;
    s += '<div class="skill-row"><span class="name">'+esc(k)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span class="pc">'+p+'%</span></div>';
  });
  s += '</div></div>';
  s += '<div class="lesson"><span class="tiny">Six lessons to keep</span><ul class="recap">';
  w.stages.forEach(function(st){ s += '<li><b>'+esc(st.rank)+'</b><span>'+esc(st.lesson)+'</span></li>'; });
  s += '</ul></div>';
  s += '<div class="share" id="sharetext">'+esc(shareText)+'</div>';
  s += '<div class="note" id="note" aria-live="polite"></div>';
  s += '<div class="btn-row"><button class="btn ghost" data-act="copy">Copy my score</button><button class="btn" data-act="start" data-who="'+other+'">Play as '+esc(WORLDS[other].name)+'</button></div>';
  s += '<button class="btn ghost" data-act="start" data-who="'+S.who+'">Play '+esc(w.name)+' again</button>';
  s += '<p class="fine">The Street Index is a fun reasoning score from 12 life tasks. It is not a clinical IQ test.</p>';
  return s + '</div>';
}

function render(){
  if(!S){ app.className = "app"; app.innerHTML = vHome(); return; }
  app.className = "app " + world().cls;
  var p = S.phase;
  app.innerHTML = p === "intro" ? vIntro() : p === "task" ? vTask() : p === "result" ? vResult() : p === "night" ? vNight() : p === "end" ? vEnd() : vHome();
}

/* ---------- actions ---------- */
function note(msg){ var n = document.getElementById("note"); if(n){ n.textContent = msg; } }

function copyScore(){
  var el = document.getElementById("sharetext");
  var text = el ? el.textContent : "";
  var fallback = function(){
    try{
      var r = document.createRange(); r.selectNodeContents(el);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }catch(e){}
    note("The text is selected. Press and hold, then choose Copy.");
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ note("Copied. Send it to a friend."); }, fallback);
    } else { fallback(); }
  }catch(e){ fallback(); }
}

app.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(!b){ return; }
  var act = b.getAttribute("data-act");
  if(act === "start"){
    S = newState(b.getAttribute("data-who")); save(); render(); window.scrollTo(0,0);
  } else if(act === "continue"){
    var l = load(); if(l){ S = l; render(); window.scrollTo(0,0); }
  } else if(act === "begin"){
    var st = world().stages[S.stage]; S.task = 0; S.order = shuffle(st.tasks[0].opts.length); go("task");
  } else if(act === "pick"){
    if(S.phase !== "task"){ return; }
    var i = parseInt(b.getAttribute("data-i"), 10);
    var t = world().stages[S.stage].tasks[S.task], opt = t.opts[i];
    var before = S.cash;
    S.cash = Math.max(0, S.cash + opt.c);
    S.heart = clamp(S.heart + opt.h, 0, 100);
    S.pts += opt.p;
    S.answers.push({k:t.skill, p:opt.p});
    S.pick = {i:i, dc:S.cash - before};
    S.wall = S.heart <= 0;
    go("result");
  } else if(act === "next"){
    if(S.wall){ S.heart = 30; S.wall = false; }
    var stg = world().stages[S.stage];
    if(S.task < stg.tasks.length - 1){
      S.task += 1; S.order = shuffle(stg.tasks[S.task].opts.length); go("task");
    } else { go("night"); }
  } else if(act === "advance"){
    if(S.stage < 5){ S.stage += 1; S.task = 0; go("intro"); }
    else { go("end"); }
  } else if(act === "copy"){
    copyScore();
  }
});

render();
})();
</script>

</body></html>
